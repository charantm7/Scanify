name: Playwright Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_APP_DOMAIN: ${{ vars.NEXT_PUBLIC_APP_DOMAIN }}

      NEXT_PUBLIC_SIGNUP_EMAIL_REDIRECT_TO: ${{vars.NEXT_PUBLIC_SIGNUP_EMAIL_REDIRECT_TO}}
      NEXT_PUBLIC_PASSWORD_RESET_EMAIL_REDIRECT_TO: ${{vars.NEXT_PUBLIC_PASSWORD_RESET_EMAIL_REDIRECT_TO}}
      NEXT_PUBLIC_OAUTH_EMAIL_REDIRECT_TO: ${{vars.NEXT_PUBLIC_OAUTH_EMAIL_REDIRECT_TO}}
      NEXT_PUBLIC_COOLDOWN_SECONDS: ${{vars.NEXT_PUBLIC_COOLDOWN_SECONDS}}

      RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
